[pytest]
# Everyday run skips two kinds of test; CI runs everything (-m "").
#   slow:     real training loops, minutes each
#   archived: tools for closed experiments, kept so the tools do not rot
addopts = -m "not slow and not archived"
markers =
    slow: runs a real training loop (minutes); skipped by default
    archived: guards a tool from a closed experiment; skipped by default
