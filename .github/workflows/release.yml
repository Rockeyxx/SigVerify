name: Build installers

# Issue #42: one download per system, attached to the GitHub release.
# Runs on every push to main (a merge): the tag job makes a pre-release named after the app
# version (v1.0.x, src/app_version.py) and the build attaches the installers to it. Also runs
# when a release is published by hand, or by hand for an existing release.
on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag of an existing release to build and attach the files to
        required: true

# Least privilege by default. Only the attach job may write to the release.
permissions: {}

jobs:
  # build and attach first: skylos ties its runner finding to the first runner line (tag is last)
  build:
    needs: tag
    # tag is skipped for a release published by hand or a manual run; build still runs then
    if: ${{ !cancelled() && (needs.tag.result == 'success' || needs.tag.result == 'skipped') }}
    env:
      TAG: ${{ needs.tag.outputs.tag || github.event.release.tag_name || inputs.tag }}
    strategy:
      fail-fast: false
      matrix:
        # 22.04, not latest: an AppImage runs only on systems with a glibc at least as new as
        # the build system's. Move to the oldest supported image when GitHub retires 22.04.
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}  # skylos: ignore[SKY-D295] the matrix lists GitHub-hosted images only, never self-hosted
    timeout-minutes: 60  # torch install and PyInstaller take about 15 minutes
    permissions:
      contents: read
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout the release tag
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0             # the app version counts commits (src/app_version.py)
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'

      - name: Install the app's libraries and PyInstaller, nothing else
        run: |
          python -m pip install --upgrade pip  # skylos: ignore[SKY-D337] the only extra index is download.pytorch.org (PyTorch's own), for the CPU wheel
          # CPU torch from the CPU index first; requirements-app.txt then leaves it alone.
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-app.txt -r requirements-build.txt

      - name: Download the shipped weights and check their SHA-256
        env:
          GH_TOKEN: ${{ github.token }}
        run: python bundle/fetch_weights.py

      - name: Build the app folder
        run: pyinstaller --noconfirm bundle/sigverify.spec

      - name: Check the package (layout, then a 30 s start with --debug)
        run: python bundle/check_bundle.py dist/SigVerify

      - name: Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$($env:TAG.TrimStart('v'))" bundle\windows\sigverify.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Linux AppImage
        if: runner.os == 'Linux'
        run: bash bundle/linux/build_appimage.sh "$TAG"

      - name: Keep the file for the attach job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: package-${{ runner.os }}
          path: |
            dist/*-setup.exe
            dist/*.AppImage
          if-no-files-found: error

  attach:
    needs: [tag, build]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      TAG: ${{ needs.tag.outputs.tag || github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Collect both files
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: out
          merge-multiple: true

      - name: Attach them to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" out/* --clobber --repo "$GITHUB_REPOSITORY"

  tag:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write   # creates the tag and the pre-release
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout main with its history
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0             # the app version counts commits
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'

      - name: Work out the app version
        id: version
        run: echo "tag=v$(python -c 'from src.app_version import app_version; print(app_version())')" >> "$GITHUB_OUTPUT"

      - name: Create the pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "SigVerify $TAG" \
            --notes "Automatic build of main at $GITHUB_SHA. The Windows installer and the Linux AppImage are attached when the build finishes (about 15 minutes). Weights: release $(python -c 'from config.settings import MODEL_VERSION; print(MODEL_VERSION)')."
