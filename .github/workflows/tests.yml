name: Run Tests

on:
  push:
    # `develop` never existed, so naming it here meant pushes to the branch the
    # work actually happens on (`Model`) ran no CI at all.
    branches: [main, Model]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege by default. A job that needs more grants it itself.
permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # Do not leave the job token in .git/config for later steps to reuse.
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.10'

      - name: Cache pip packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # torch comes from the CPU index and ONLY the CPU index. The previous
          # `-r requirements.txt --extra-index-url <pytorch>` merged both indexes
          # and let pip pick whichever held the higher version — normally the
          # CUDA-linked PyPI wheel. CI then measured a build the deployment path
          # never runs. Installing torch first also satisfies the requirements
          # pin below, so the second command leaves it alone.
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Download release weights (mandatory)
        env:
          GH_TOKEN: ${{ github.token }}
          WEIGHTS_TAG: v0.9.0
        run: |
          mkdir -p models/weights
          # Pinned to an explicit tag. Untagged, `gh release download` takes
          # whatever release is newest, so cutting a release silently changed
          # what CI was testing with no commit to point at. Bumping weights is
          # now a deliberate edit to this line.
          # Each weight travels with its writer-split record (<name>.split.json);
          # benchmark.py and evaluate.py use it to refuse scoring a checkpoint on
          # writers it trained on. Without the record they only warn.
          gh release download "$WEIGHTS_TAG" --dir models/weights \
            -p "spatial_cnn.pth" -p "temporal_lstm.pth" \
            -p "spatial_cnn.split.json" -p "temporal_lstm.split.json" --clobber

      - name: Download ensemble weights (optional)
        env:
          GH_TOKEN: ${{ github.token }}
          WEIGHTS_TAG: v0.9.0
        continue-on-error: true
        run: |
          # The six seeds ARE published in the release — an earlier comment here
          # claimed they were not, which is why CI fetched 2 of the 8 assets and
          # the only test that loads a real ensemble
          # (tests/test_service.py::test_load_temporal_ensemble_returns_models_when_present)
          # skipped on every run. They stay optional: a release without them, or
          # a fork without release access, must not fail the build.
          gh release download "$WEIGHTS_TAG" --dir models/weights \
            -p "temporal_dt_s4*.pth" -p "temporal_dt_s4*.split.json" --clobber

      - name: Run pytest
        run: |
          pytest tests/ -v --tb=short --junitxml=pytest-results.xml


      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pytest-results
          path: pytest-results.xml
          if-no-files-found: error

  skylos:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Skylos - Python SAST, Dead Code Detection & PR Gate
        uses: duriantaco/skylos@89d33c0e856f3451eb88c7f60410051ded8d3109 # v4.35.0
