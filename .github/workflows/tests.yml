name: Run Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# Least privilege by default. A job that needs more grants it itself.
permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # Do not leave the job token in .git/config for later steps to reuse.
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.10'

      - name: Cache pip packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # torch comes from the CPU index and ONLY the CPU index. The previous
          # `-r requirements.txt --extra-index-url <pytorch>` merged both indexes
          # and let pip pick whichever held the higher version — normally the
          # CUDA-linked PyPI wheel. CI then measured a build the deployment path
          # never runs. Installing torch first also satisfies the requirements
          # pin below, so the second command leaves it alone.
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Download release weights (mandatory)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p models/weights
          # Download only spatial_cnn.pth and temporal_lstm.pth from GitHub releases.
          # Ensemble weights (6 seeds) are optional and not distributed in releases.
          gh release download --dir models/weights -p "spatial_cnn.pth" -p "temporal_lstm.pth" --clobber

      - name: Run pytest
        run: |
          pytest tests/ -v --tb=short --junitxml=pytest-results.xml


      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pytest-results
          path: pytest-results.xml
          if-no-files-found: error

  skylos:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Skylos - Python SAST, Dead Code Detection & PR Gate
        uses: duriantaco/skylos@89d33c0e856f3451eb88c7f60410051ded8d3109 # v4.35.0
